<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0J8DVETW8G"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0J8DVETW8G');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFB Rankings - Cheesy Sports</title>
    <link rel="stylesheet" href="cyberpunk.css">
    <style>
        .controls {
            display: flex;
            gap: 8px;
            align-items: stretch;
            max-width: 400px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .controls .cy-input-sm { flex: 0 0 90px; }
        .controls select {
            flex: 1;
            min-width: 140px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 13px;
        }
        .controls select:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 8px var(--purple-glow);
        }

        .poll-card {
            background: var(--surface);
            border: 1px solid var(--purple);
            border-radius: 2px;
            padding: 20px 24px;
            margin: 24px auto;
            max-width: 800px;
            position: relative;
            box-shadow: 0 0 12px var(--purple-glow);
        }
        .poll-card::before {
            content: '';
            position: absolute;
            width: 12px; height: 12px;
            top: -1px; left: -1px;
            border-style: solid;
            border-width: 2px 0 0 2px;
            border-color: var(--purple);
        }
        .poll-card::after {
            content: '';
            position: absolute;
            width: 12px; height: 12px;
            bottom: -1px; right: -1px;
            border-style: solid;
            border-width: 0 2px 2px 0;
            border-color: var(--purple);
        }

        .poll-card h2 {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.06em;
            margin: 0 0 16px;
            text-align: center;
        }

        .poll-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 13px;
        }
        .poll-table th {
            color: var(--purple);
            font-weight: 400;
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1px solid var(--purple);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .poll-table td {
            color: var(--text-dim);
            padding: 8px 6px;
            border-bottom: 1px solid var(--border);
        }
        .poll-table tr:last-child td { border-bottom: none; }
        .poll-table td:first-child {
            color: var(--text);
            font-weight: 700;
            width: 40px;
            text-align: center;
        }
        .poll-table a {
            color: var(--blue);
            text-decoration: none;
        }
        .poll-table a:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--blue-glow);
        }

        #loading {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-dim);
            padding: 40px 0;
        }

        #error-msg {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--orange);
            padding: 40px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="neon-bar"></div>

    <header class="page-header">
        <div class="header-nav">
            <a href="collegefootball.html" class="btn btn-amber">Back to College Football</a>
            <a href="cheesyhome.html" class="btn btn-green">Cheesyman Home</a>
        </div>
        <div class="header-kicker">cheesyman.com // sports // cfb</div>
        <h1>POLL RANKINGS</h1>
        <p class="header-sub">Weekly college football poll rankings.</p>
    </header>

    <main class="page-wrap" style="padding-top:40px;">

        <div class="section-label">select week</div>
        <div class="controls">
            <input type="text" id="yearInput" class="cy-input cy-input-sm" placeholder="Year" value="2026">
            <select id="weekSelect"><option value="">Loading...</option></select>
        </div>
        <div style="text-align:center; margin-top:12px;">
            <button onclick="loadRankings()" class="btn btn-purple">Go</button>
        </div>

        <div id="loading">Loading rankings...</div>
        <div id="error-msg"></div>
        <div id="polls-container"></div>

    </main>

    <footer class="page-footer">
        &copy; <span id="currentYear"></span> Cheesyman Inc. All rights reserved.
    </footer>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        const SHOWN_POLLS = ['AP Top 25', 'Coaches Poll', 'FCS Coaches Poll'];
        let allWeeksData = [];

        // Read year from URL param if present
        const urlParams = new URLSearchParams(window.location.search);
        const urlYear = urlParams.get('year');
        if (urlYear) document.getElementById('yearInput').value = urlYear;

        loadRankings();

        async function loadRankings() {
            const year = document.getElementById('yearInput').value.trim() || new Date().getFullYear();
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error-msg');
            const container = document.getElementById('polls-container');

            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            container.innerHTML = '';

            try {
                const response = await fetch(`/rankings_api/rankings?sport=cfb&year=${year}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                allWeeksData = await response.json();
                loadingEl.style.display = 'none';

                if (!allWeeksData.length) {
                    errorEl.textContent = 'No rankings data found for this year.';
                    errorEl.style.display = 'block';
                    return;
                }

                populateWeekDropdown();
                // Display the latest week by default
                displayWeek(allWeeksData.length - 1);
            } catch (err) {
                loadingEl.style.display = 'none';
                errorEl.textContent = 'Failed to load rankings. Please try again.';
                errorEl.style.display = 'block';
                console.error('Rankings fetch error:', err);
            }
        }

        function populateWeekDropdown() {
            const select = document.getElementById('weekSelect');
            select.innerHTML = '';
            allWeeksData.forEach((weekData, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = weekData.seasonType === 'postseason'
                    ? `Final Poll`
                    : `Week ${weekData.week}`;
                select.appendChild(option);
            });
            // Default to latest week
            select.value = allWeeksData.length - 1;
        }

        document.getElementById('weekSelect').addEventListener('change', function() {
            displayWeek(parseInt(this.value));
        });

        function displayWeek(index) {
            const container = document.getElementById('polls-container');
            container.innerHTML = '';
            const weekData = allWeeksData[index];
            const year = document.getElementById('yearInput').value.trim();

            const filteredPolls = weekData.polls
                .filter(p => SHOWN_POLLS.includes(p.poll))
                .sort((a, b) => SHOWN_POLLS.indexOf(a.poll) - SHOWN_POLLS.indexOf(b.poll));

            if (!filteredPolls.length) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-dim); font-family:var(--font-mono); padding:20px;">No matching polls for this week.</p>';
                return;
            }

            filteredPolls.forEach(poll => {
                const card = document.createElement('div');
                card.className = 'poll-card';

                let tableRows = poll.ranks.map(team => `
                    <tr>
                        <td>${team.rank}</td>
                        <td><a href="team.html?team=${encodeURIComponent(team.school)}&year=${year}">${team.school}</a></td>
                        <td>${team.conference}</td>
                        <td>${team.points}</td>
                        <td>${team.firstPlaceVotes || '-'}</td>
                    </tr>
                `).join('');

                card.innerHTML = `
                    <h2>${poll.poll}</h2>
                    <table class="poll-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>School</th>
                                <th>Conference</th>
                                <th>Points</th>
                                <th>1st</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                `;
                container.appendChild(card);
            });
        }

        // Allow Enter key on year input to reload
        document.getElementById('yearInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadRankings();
        });
    </script>
</body>
</html>
